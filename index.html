<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATUS — The Cactus Cat of Robinhood</title>
<style>
  :root{
    --cream:#fbf9e9;
    --cream-2:#f4f2dc;
    --green:#8fd400;
    --green-dark:#2f5e12;
    --green-deep:#1f3d0c;
    --green-mid:#5a9c1f;
    --ink:#1a2e0a;
    --pink:#ff8fa3;
    --white:#ffffff;
    --shadow-hard: 4px 4px 0 var(--ink);
    --shadow-hard-lg: 6px 6px 0 var(--ink);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Baloo 2','Segoe UI',sans-serif;
    background:var(--cream);
    color:var(--ink);
    overflow-x:hidden;
  }
  @font-face{
    font-family:'Baloo 2';
    src:local('Baloo 2');
  }
  h1,h2,h3,.chunky{
    font-family:'Baloo 2','Segoe UI',sans-serif;
    font-weight:800;
  }
  img{display:block;max-width:100%;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 26px;border-radius:40px;
    font-weight:800;font-size:1rem;
    border:3px solid var(--ink);
    cursor:pointer;
    box-shadow:var(--shadow-hard);
    transition:transform .15s ease, box-shadow .15s ease;
    text-decoration:none;color:var(--ink);
  }
  .btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
  .btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink);}
  .btn-primary{background:var(--green);}
  .btn-secondary{background:var(--white);}

  /* decorative floating cacti */
  .bg-cactus{position:absolute;opacity:.9;pointer-events:none;}

  /* ===== NAV ===== */
  header.nav{
    padding:24px 0 0;
  }
  .nav-inner{display:flex;justify-content:space-between;align-items:center;}
  .logo{display:flex;align-items:center;gap:10px;font-size:1.6rem;letter-spacing:.5px;}
  .logo-badge{
    width:44px;height:44px;border-radius:14px;background:var(--green);
    border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-hard);
  }
  .robinhood-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--cream-2);border:2px solid var(--green-dark);
    border-radius:30px;padding:8px 18px;font-weight:700;font-size:.85rem;
  }

  /* ===== HERO ===== */
  .hero-banner{padding:24px 0 10px;}
  .hero-ctas-banner{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:24px;}
  .hero{
    position:relative;
    padding:40px 0 60px;
    overflow:hidden;
  }
  .hero-grid{
    display:grid;grid-template-columns:1.05fr 1fr;
    gap:20px;align-items:center;
    position:relative;z-index:2;
  }
  .hero-eyebrow{display:flex;gap:6px;margin-bottom:6px;}
  .hero h1{
    font-size:clamp(3.4rem,8vw,6rem);
    color:var(--green);
    -webkit-text-stroke:3px var(--ink);
    line-height:.95;
    text-shadow:6px 6px 0 var(--ink);
    letter-spacing:1px;
  }
  .hero-sub{
    font-size:1.4rem;font-weight:700;margin-top:14px;
  }
  .hero-sub .accent{color:var(--green-mid);}
  .tagline-pill{
    display:inline-block;background:var(--green);
    border:3px solid var(--ink);border-radius:30px;
    padding:10px 22px;font-weight:800;font-size:1.15rem;
    margin:16px 0;box-shadow:var(--shadow-hard);
    transform:rotate(-1deg);
  }
  .hero-desc{max-width:460px;font-size:1.02rem;line-height:1.5;font-weight:600;color:var(--green-deep);margin-bottom:24px;}
  .hero-ctas{display:flex;gap:16px;flex-wrap:wrap;}

  .hero-art{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:520px;}
  .speech-bubble{
    position:absolute;top:6%;right:0;
    background:var(--white);border:3px solid var(--ink);
    border-radius:24px;padding:14px 20px;
    font-weight:800;font-size:.95rem;line-height:1.3;
    box-shadow:var(--shadow-hard);
    z-index:5;
  }
  .speech-bubble .line2{color:var(--green-mid);}
  .speech-bubble::after{
    content:'';position:absolute;bottom:-16px;left:38px;
    width:0;height:0;
    border:14px solid transparent;
    border-top-color:var(--white);
    border-bottom:0;
  }
  .heart-float{position:absolute;color:var(--green);opacity:.85;}

  /* ===== FEATURES BAR ===== */
  .features{
    background:var(--white);
    border:3px solid var(--ink);
    border-radius:26px;
    box-shadow:var(--shadow-hard-lg);
    margin:0 auto 60px;
    padding:34px 20px;
  }
  .features-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
  }
  .feature-item{display:flex;gap:14px;align-items:flex-start;position:relative;}
  .feature-item:not(:last-child)::after{
    content:'';position:absolute;right:-10px;top:4px;bottom:4px;width:1px;
    background:repeating-linear-gradient(to bottom,var(--green) 0 6px,transparent 6px 12px);
  }
  .feature-icon{
    width:52px;height:52px;flex:0 0 52px;
    background:var(--cream-2);border:2.5px solid var(--ink);border-radius:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .feature-item h4{color:var(--green-mid);font-size:.95rem;margin-bottom:4px;letter-spacing:.3px;}
  .feature-item p{font-size:.85rem;font-weight:600;line-height:1.35;color:var(--green-deep);}

  .features-img{margin-bottom:50px;}

  /* ===== WHY CATUS ===== */
  .why{padding:20px 0 60px;text-align:center;}
  .why-img{padding:20px 0 60px;}
  .why h2{
    font-size:2.4rem;color:var(--ink);
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-bottom:44px;
  }
  .why h2 .zig{color:var(--green);font-size:2rem;}
  .why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;}
  .why-card{display:flex;flex-direction:column;align-items:center;}
  .why-portrait{
    width:100%;aspect-ratio:1/1;border-radius:22px;
    background:var(--cream-2);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;position:relative;overflow:hidden;
  }
  .why-card h4{color:var(--green-mid);font-size:1.05rem;margin-bottom:4px;}
  .why-card p{font-size:.85rem;font-weight:600;color:var(--green-deep);}

  /* ===== MOVEMENT ===== */
  .movement{
    background:var(--green);
    border:3px solid var(--ink);border-radius:26px;
    box-shadow:var(--shadow-hard-lg);
    margin:0 auto 50px;
    padding:34px;
    display:grid;grid-template-columns:.9fr 1.3fr 1fr;gap:24px;align-items:center;
  }
  .movement-mascot{display:flex;justify-content:center;}
  .movement-text h3{font-size:1.7rem;line-height:1.15;margin-bottom:12px;}
  .movement-text h3 .underline{text-decoration:underline;text-decoration-color:var(--ink);text-decoration-thickness:3px;}
  .movement-text p{font-weight:600;font-size:.95rem;line-height:1.5;color:var(--green-deep);}
  .polaroids{display:flex;gap:10px;justify-content:flex-end;}
  .polaroid{
    background:var(--white);border:2px solid var(--ink);
    border-radius:6px;padding:6px 6px 16px;
    box-shadow:3px 3px 0 var(--ink);
    width:90px;
  }
  .polaroid:nth-child(1){transform:rotate(-6deg);}
  .polaroid:nth-child(2){transform:rotate(2deg);margin-top:10px;}
  .polaroid:nth-child(3){transform:rotate(8deg);}
  .polaroid .photo{width:100%;aspect-ratio:1/1;border-radius:2px;overflow:hidden;background:var(--cream-2);}

  .movement-img{margin-bottom:50px;}

  /* ===== FOOTER ===== */
  footer{
    background:var(--green);
    border-top:3px solid var(--ink);
    padding:34px 0 26px;
  }
  .footer-top{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;
  }
  .footer-brand{
    display:flex;align-items:center;gap:10px;font-size:1.15rem;letter-spacing:.5px;
  }
  .footer-logo-badge{
    width:38px;height:38px;border-radius:12px;background:var(--white);
    border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;
  }
  .footer-follow{
    display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .footer-follow span{font-weight:800;font-size:.8rem;letter-spacing:.5px;}
  .social-icon{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--ink);
    background:var(--ink);
    transition:transform .15s ease;
  }
  .social-icon:hover{transform:translateY(-3px);}
  .footer-hr{
    height:2px;margin:26px 0 20px;
    background:repeating-linear-gradient(to right, var(--ink) 0 8px, transparent 8px 16px);
    opacity:.35;
  }
  .footer-bottom{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
  }
  .on-rh{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--white);border:2px solid var(--ink);
    border-radius:30px;padding:8px 20px;font-weight:800;font-size:.85rem;
  }
  .copyright{font-size:.82rem;font-weight:600;color:var(--green-deep);}

  @media(max-width:560px){
    .footer-top,.footer-bottom{justify-content:center;text-align:center;}
  }

  /* decorative desert strip */
  .desert-strip{position:relative;height:26px;}

  @media(max-width:980px){
    .hero-grid{grid-template-columns:1fr;}
    .hero-art{order:-1;min-height:380px;}
    .features-grid{grid-template-columns:repeat(2,1fr);row-gap:26px;}
    .feature-item:nth-child(2)::after{display:none;}
    .why-grid{grid-template-columns:repeat(2,1fr);}
    .movement{grid-template-columns:1fr;text-align:center;}
    .polaroids{justify-content:center;}
  }
  @media(max-width:560px){
    .why-grid{grid-template-columns:1fr;}
    .features-grid{grid-template-columns:1fr;}
    .feature-item::after{display:none;}
    .hero h1{font-size:3rem;}
  }

  /* ===== MODAL ===== */
  .modal-overlay{
    display:none;position:fixed;inset:0;z-index:100;
    background:rgba(26,46,10,.55);
    align-items:center;justify-content:center;
    padding:20px;
  }
  .modal-card{
    position:relative;
    background:var(--cream);
    border:3px solid var(--ink);
    border-radius:24px;
    box-shadow:var(--shadow-hard-lg);
    padding:38px 30px 32px;
    max-width:360px;width:100%;
    text-align:center;
  }
  .modal-icon{font-size:2.6rem;margin-bottom:6px;}
  .modal-card h3{font-size:1.6rem;color:var(--green-mid);margin-bottom:10px;}
  .modal-card p{font-size:.92rem;font-weight:600;color:var(--green-deep);line-height:1.5;margin-bottom:22px;}
  .modal-btn{width:100%;justify-content:center;}
  .modal-close{
    position:absolute;top:14px;right:14px;
    width:32px;height:32px;border-radius:50%;
    border:2px solid var(--ink);background:var(--white);
    font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
</style>
</head>
